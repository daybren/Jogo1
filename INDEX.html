<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Duel - Equações do 2º Grau</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Evita zoom e scroll indesejado no mobile */
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* Transições suaves para feedback de erro/acerto */
        .bg-transition {
            transition: background-color 0.15s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen w-screen flex flex-col">

    <!-- ================= JOGADOR 1 (CIMA - VERMELHO) ================= -->
    <div id="p1-container" class="flex-1 relative flex flex-col p-4 sm:p-6 rotate-180 bg-red-600 bg-transition">
        
        <!-- Overlay de Congelamento -->
        <div id="p1-freeze-overlay" class="hidden absolute inset-0 bg-black/85 z-20 flex-col items-center justify-center backdrop-blur-sm">
            <span class="text-red-500 text-3xl font-bold mb-4 uppercase tracking-widest drop-shadow-lg">Congelado! 🥶</span>
            <span id="p1-freeze-timer" class="text-white text-8xl font-black drop-shadow-2xl">15</span>
        </div>

        <!-- Botões de Opções -->
        <div id="p1-options" class="grid grid-cols-2 gap-3 sm:gap-4 w-full max-w-sm mx-auto mt-2">
            <!-- Gerado via JS -->
        </div>

        <!-- Área Central da Equação e Bomba -->
        <div class="flex-1 flex flex-col items-center justify-center w-full my-4">
            <button id="p1-bomb-btn" onclick="useBomb(1)" class="hidden w-full max-w-sm bg-red-900 text-white border-2 border-red-400 text-xl font-black py-3 rounded-xl mb-4 animate-pulse uppercase shadow-[0_0_15px_rgba(248,113,113,0.6)] active:scale-95 transition-all">
                Jogar Bomba 💣 (<span id="p1-bomb-count">0</span>)
            </button>
            <div id="p1-equation" class="text-yellow-300 text-4xl sm:text-5xl font-black drop-shadow-md text-center bg-black/20 px-6 py-4 rounded-2xl w-full max-w-sm">
                x² = 0
            </div>
        </div>
        
        <!-- Rodapé do Jogador -->
        <div class="w-full flex justify-between items-center pt-3 border-t-2 border-white/20 mt-auto">
            <div class="flex flex-col">
                <span class="text-white/90 text-lg font-bold uppercase tracking-widest">Jogador 1</span>
                <span class="text-white/70 text-sm font-medium">Vitórias: <span id="p1-wins">0</span></span>
            </div>
            <div class="flex items-baseline gap-1">
                <span id="p1-score" class="text-white text-4xl sm:text-5xl font-black">0</span>
                <span class="text-red-200 font-bold text-sm">/10</span>
            </div>
        </div>
    </div>

    <!-- ================= DIVISOR CENTRAL ================= -->
    <div class="w-full h-3 bg-gray-950 flex items-center justify-center relative z-10 shadow-[0_0_15px_rgba(0,0,0,0.8)]">
        <div id="round-indicator" class="absolute bg-gray-800 px-4 py-1.5 rounded-full text-white text-xs sm:text-sm font-black tracking-widest border border-gray-600 shadow-lg">
            RODADA 1/2
        </div>
    </div>

    <!-- ================= JOGADOR 2 (BAIXO - AZUL) ================= -->
    <div id="p2-container" class="flex-1 relative flex flex-col p-4 sm:p-6 bg-blue-600 bg-transition">
        
        <!-- Overlay de Congelamento -->
        <div id="p2-freeze-overlay" class="hidden absolute inset-0 bg-black/85 z-20 flex-col items-center justify-center backdrop-blur-sm">
            <span class="text-blue-500 text-3xl font-bold mb-4 uppercase tracking-widest drop-shadow-lg">Congelado! 🥶</span>
            <span id="p2-freeze-timer" class="text-white text-8xl font-black drop-shadow-2xl">15</span>
        </div>

        <!-- Botões de Opções -->
        <div id="p2-options" class="grid grid-cols-2 gap-3 sm:gap-4 w-full max-w-sm mx-auto mt-2">
            <!-- Gerado via JS -->
        </div>

        <!-- Área Central da Equação e Bomba -->
        <div class="flex-1 flex flex-col items-center justify-center w-full my-4">
            <button id="p2-bomb-btn" onclick="useBomb(2)" class="hidden w-full max-w-sm bg-blue-900 text-white border-2 border-blue-400 text-xl font-black py-3 rounded-xl mb-4 animate-pulse uppercase shadow-[0_0_15px_rgba(96,165,250,0.6)] active:scale-95 transition-all">
                Jogar Bomba 💣 (<span id="p2-bomb-count">0</span>)
            </button>
            <div id="p2-equation" class="text-yellow-300 text-4xl sm:text-5xl font-black drop-shadow-md text-center bg-black/20 px-6 py-4 rounded-2xl w-full max-w-sm">
                x² = 0
            </div>
        </div>
        
        <!-- Rodapé do Jogador -->
        <div class="w-full flex justify-between items-center pt-3 border-t-2 border-white/20 mt-auto">
            <div class="flex flex-col">
                <span class="text-white/90 text-lg font-bold uppercase tracking-widest">Jogador 2</span>
                <span class="text-white/70 text-sm font-medium">Vitórias: <span id="p2-wins">0</span></span>
            </div>
            <div class="flex items-baseline gap-1">
                <span id="p2-score" class="text-white text-4xl sm:text-5xl font-black">0</span>
                <span class="text-blue-200 font-bold text-sm">/10</span>
            </div>
        </div>
    </div>

    <!-- ================= TELAS DE SOBREPOSIÇÃO (OVERLAYS) ================= -->
    
    <!-- Fim de Rodada -->
    <div id="round-over-overlay" class="hidden absolute inset-0 bg-gray-950/95 z-50 flex-col items-center justify-center p-8 backdrop-blur-md">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-4xl font-black text-gray-800 mb-2 uppercase tracking-wider">Fim da Rodada <span id="overlay-round-num">1</span></h1>
            <div class="py-6 mb-6">
                <h2 id="round-winner-text" class="text-3xl font-black text-gray-800">Jogador X Venceu! 🎉</h2>
            </div>
            <button onclick="startNextRound()" class="w-full py-4 bg-yellow-500 hover:bg-yellow-600 text-gray-900 text-xl font-black rounded-xl shadow-[0_6px_0_rgb(202,138,4)] active:shadow-[0_0px_0_rgb(202,138,4)] active:translate-y-1.5 transition-all uppercase tracking-wide">
                Próxima Rodada
            </button>
        </div>
    </div>

    <!-- Fim de Jogo -->
    <div id="game-over-overlay" class="hidden absolute inset-0 bg-gray-950/95 z-50 flex-col items-center justify-center p-8 backdrop-blur-md">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-4xl font-black text-gray-800 mb-6 uppercase tracking-wider">Fim de Jogo!</h1>
            
            <div class="flex justify-around items-center mb-8">
                <div class="flex flex-col items-center">
                    <span class="text-red-600 font-bold text-lg uppercase">Jogador 1</span>
                    <span id="final-p1-wins" class="text-5xl font-black text-gray-800">0</span>
                    <span class="text-sm text-gray-500">Vitórias</span>
                </div>
                <div class="text-3xl text-gray-300 font-black">X</div>
                <div class="flex flex-col items-center">
                    <span class="text-blue-600 font-bold text-lg uppercase">Jogador 2</span>
                    <span id="final-p2-wins" class="text-5xl font-black text-gray-800">0</span>
                    <span class="text-sm text-gray-500">Vitórias</span>
                </div>
            </div>

            <div class="py-4 mb-8 bg-gray-100 rounded-xl">
                <h2 id="game-champion-text" class="text-2xl font-black text-gray-800">Campeão! 🏆</h2>
            </div>

            <button onclick="restartGame()" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white text-xl font-bold rounded-xl shadow-[0_6px_0_rgb(21,128,61)] active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-1.5 transition-all uppercase tracking-wide">
                Jogar Novamente
            </button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // Estado Global do Jogo
        const state = {
            gameState: 'playing', // 'playing', 'round_over', 'game_over'
            currentRound: 1,
            p1: { queue: [], score: 0, bombs: 0, freeze: 0, wins: 0 },
            p2: { queue: [], score: 0, bombs: 0, freeze: 0, wins: 0 }
        };

        let timerInterval;

        // Funções Utilitárias Matemáticas
        const formatEquation = (b, c) => {
            let eq = "x²";
            if (b === 1) eq += " + x";
            else if (b === -1) eq += " - x";
            else if (b > 1) eq += ` + ${b}x`;
            else if (b < -1) eq += ` - ${Math.abs(b)}x`;

            if (c > 0) eq += ` + ${c}`;
            else if (c < 0) eq += ` - ${Math.abs(c)}`;

            eq += " = 0";
            return eq;
        };

        const generateOptions = (r1, r2) => {
            const correct = [Math.min(r1, r2), Math.max(r1, r2)];
            const opts = [correct];

            while (opts.length < 4) {
                let tr1 = Math.floor(Math.random() * 19) - 9; // -9 a 9
                let tr2 = Math.floor(Math.random() * 19) - 9;
                let cand = [Math.min(tr1, tr2), Math.max(tr1, tr2)];

                let exists = opts.some(o => o[0] === cand[0] && o[1] === cand[1]);
                if (!exists) {
                    opts.push(cand);
                }
            }
            // Embaralhar as opções
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return opts;
        };

        const generateQuestion = () => {
            const r1 = Math.floor(Math.random() * 19) - 9;
            const r2 = Math.floor(Math.random() * 19) - 9;
            const b = -(r1 + r2);
            const c = r1 * r2;
            return { 
                equationStr: formatEquation(b, c), 
                options: generateOptions(r1, r2), 
                correctStr: `${Math.min(r1, r2)}, ${Math.max(r1, r2)}` 
            };
        };

        const generateDeck = (size) => Array.from({ length: size }, generateQuestion);

        // Inicialização de Rodada e Jogo
        const initRound = () => {
            state.p1.queue = generateDeck(10);
            state.p2.queue = generateDeck(10);
            state.p1.score = 0;
            state.p2.score = 0;
            state.p1.bombs = 0;
            state.p2.bombs = 0;
            state.p1.freeze = 0;
            state.p2.freeze = 0;
            state.gameState = 'playing';

            document.getElementById('round-over-overlay').style.display = 'none';
            document.getElementById('game-over-overlay').style.display = 'none';
            
            updateUI();
            startTimer();
        };

        const restartGame = () => {
            state.currentRound = 1;
            state.p1.wins = 0;
            state.p2.wins = 0;
            initRound();
        };

        const startNextRound = () => {
            state.currentRound = 2;
            initRound();
        };

        // Lógica de Timer para o Congelamento (Bomba)
        const startTimer = () => {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (state.gameState !== 'playing') return;
                
                let updated = false;
                if (state.p1.freeze > 0) { state.p1.freeze--; updated = true; }
                if (state.p2.freeze > 0) { state.p2.freeze--; updated = true; }
                
                if (updated) updateUI();
            }, 1000);
        };

        // Lógica de Fim de Rodada
        const handleRoundEnd = (winner) => {
            state.gameState = 'ended';
            clearInterval(timerInterval);

            if (winner === 1) state.p1.wins++;
            else if (winner === 2) state.p2.wins++;

            updateUI(); // Atualiza contador de vitórias

            if (state.currentRound >= 2) {
                // Fim de Jogo
                document.getElementById('final-p1-wins').innerText = state.p1.wins;
                document.getElementById('final-p2-wins').innerText = state.p2.wins;
                
                const champText = document.getElementById('game-champion-text');
                if (state.p1.wins > state.p2.wins) {
                    champText.innerHTML = '<span class="text-red-600">Jogador 1 Campeão! 🏆</span>';
                } else if (state.p2.wins > state.p1.wins) {
                    champText.innerHTML = '<span class="text-blue-600">Jogador 2 Campeão! 🏆</span>';
                } else {
                    champText.innerHTML = '<span class="text-purple-600">Empate Histórico! 🤝</span>';
                }
                
                document.getElementById('game-over-overlay').style.display = 'flex';
            } else {
                // Fim de Rodada
                document.getElementById('overlay-round-num').innerText = state.currentRound;
                const roundWinnerText = document.getElementById('round-winner-text');
                if (winner === 1) {
                    roundWinnerText.innerHTML = '<span class="text-red-600">Jogador 1 Venceu! 🎉</span>';
                } else {
                    roundWinnerText.innerHTML = '<span class="text-blue-600">Jogador 2 Venceu! 🎉</span>';
                }
                document.getElementById('round-over-overlay').style.display = 'flex';
            }
        };

        // Ação de Responder (Tocar na opção)
        const handleTap = (playerNum, optIndex) => {
            if (state.gameState !== 'playing') return;
            
            const player = playerNum === 1 ? state.p1 : state.p2;
            const isP1 = playerNum === 1;

            if (player.freeze > 0) return; // Congelado não joga
            if (player.queue.length === 0) return;

            const currentQ = player.queue[0];
            const chosenOpt = currentQ.options[optIndex];
            const optionStr = `${chosenOpt[0]}, ${chosenOpt[1]}`;
            const isCorrect = optionStr === currentQ.correctStr;

            // Feedback Visual (Cor de fundo pisca)
            const container = document.getElementById(`p${playerNum}-container`);
            const originalColor = isP1 ? 'bg-red-600' : 'bg-blue-600';
            const wrongColor = isP1 ? 'bg-red-800' : 'bg-blue-800';
            const rightColor = 'bg-green-500';

            container.classList.remove(originalColor);
            container.classList.add(isCorrect ? rightColor : wrongColor);
            setTimeout(() => {
                container.classList.remove(isCorrect ? rightColor : wrongColor);
                container.classList.add(originalColor);
            }, 150);

            const answeredQ = player.queue.shift(); // Remove a pergunta atual

            if (isCorrect) {
                player.score++;
                if (player.score % 2 === 0) player.bombs++; // Ganha bomba a cada 2 acertos
                if (player.score >= 10) {
                    handleRoundEnd(playerNum);
                    return;
                }
            } else {
                // Se errou, a pergunta volta para o fim do baralho
                player.queue.push(answeredQ);
            }

            updateUI();
        };

        // Ação de Jogar a Bomba
        const useBomb = (playerNum) => {
            const player = playerNum === 1 ? state.p1 : state.p2;
            const opponent = playerNum === 1 ? state.p2 : state.p1;

            if (player.bombs > 0 && player.freeze === 0) {
                player.bombs--;
                opponent.freeze = 15; // Congela oponente por 15s
                updateUI();
            }
        };

        // Atualização Geral da Interface
        const updateUI = () => {
            document.getElementById('round-indicator').innerText = `RODADA ${state.currentRound}/2`;

            const renderPlayer = (pNum, pState, pColor) => {
                // Placar e Vitórias
                document.getElementById(`p${pNum}-score`).innerText = pState.score;
                document.getElementById(`p${pNum}-wins`).innerText = pState.wins;

                // Congelamento
                const freezeOverlay = document.getElementById(`p${pNum}-freeze-overlay`);
                if (pState.freeze > 0) {
                    freezeOverlay.style.display = 'flex';
                    document.getElementById(`p${pNum}-freeze-timer`).innerText = pState.freeze;
                } else {
                    freezeOverlay.style.display = 'none';
                }

                // Bomba
                const bombBtn = document.getElementById(`p${pNum}-bomb-btn`);
                if (pState.bombs > 0 && pState.freeze === 0) {
                    bombBtn.style.display = 'block';
                    document.getElementById(`p${pNum}-bomb-count`).innerText = pState.bombs;
                } else {
                    bombBtn.style.display = 'none';
                }

                // Pergunta Atual e Opções
                if (pState.queue.length > 0) {
                    const currentQ = pState.queue[0];
                    document.getElementById(`p${pNum}-equation`).innerText = currentQ.equationStr;
                    
                    const optionsContainer = document.getElementById(`p${pNum}-options`);
                    optionsContainer.innerHTML = ''; // Limpa opções antigas

                    currentQ.options.forEach((opt, index) => {
                        const btn = document.createElement('button');
                        btn.className = `bg-white/95 hover:bg-white active:bg-gray-200 text-${pColor}-700 text-2xl sm:text-3xl font-black py-5 sm:py-7 rounded-2xl shadow-[0_6px_0_rgba(0,0,0,0.3)] active:shadow-[0_0px_0_rgba(0,0,0,0.3)] active:translate-y-1.5 transition-all flex items-center justify-center leading-none`;
                        btn.innerText = `${opt[0]}, ${opt[1]}`;
                        // Evita o evento de clique padrão do touch gerando 'ghost clicks'
                        btn.onpointerdown = (e) => {
                            e.preventDefault();
                            handleTap(pNum, index);
                        };
                        optionsContainer.appendChild(btn);
                    });
                }
            };

            renderPlayer(1, state.p1, 'red');
            renderPlayer(2, state.p2, 'blue');
        };

        // Inicia o jogo ao carregar a página
        window.onload = restartGame;

    </script>
</body>
</html>
